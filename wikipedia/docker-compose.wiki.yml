# Dedicated Postgres for the Wikipedia index — separate from the tiny demo DB.
# Data dir is bind-mounted onto NVMe (QLC is fine here; see README) and the
# server is tuned for a big bulk load + HNSW build on the Threadripper.
#
#   mkdir -p /mnt/nvme3/wiki-pgdata
#   docker compose -f docker-compose.wiki.yml up -d
services:
  wikidb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: wiki
    ports:
      - "5463:5432"           # demo DB is on 5462; this is separate
    shm_size: "2gb"
    command:
      - postgres
      - -c
      - shared_buffers=8GB
      - -c
      - effective_cache_size=64GB
      - -c
      - maintenance_work_mem=16GB
      - -c
      - max_parallel_maintenance_workers=8
      - -c
      - max_parallel_workers=12
      - -c
      - work_mem=256MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=30min
    volumes:
      - /mnt/nvme3/wiki-pgdata:/var/lib/postgresql/data
